<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>탭퀴즈 - QR만 찍으면 바로 시작하는 실시간 퀴즈쇼</title>
<meta name="description" content="로그인도 설치도 없어요. 워크숍, 가족 모임, 행사에서 큰 화면과 휴대폰만 있으면 바로 같이 즐길 수 있는 실시간 퀴즈 게임.">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<script src="jelly.js"></script>
<style>
  .page{max-width:1200px;margin:0 auto;padding:28px 24px 24px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center}
  header .logo{font-family:var(--display);font-size:30px;color:var(--gold)}
  header nav{display:flex;gap:22px;font-size:14px}
  header a{color:var(--muted);text-decoration:none} header a:hover{color:var(--text)}
  main{flex-grow:1;display:flex;align-items:center;justify-content:space-between;gap:56px;padding:32px 0}
  .hero{max-width:680px;display:flex;flex-direction:column;gap:20px}
  .eyebrow{font-size:13px;font-weight:700;letter-spacing:.18em;color:var(--gold)}
  h1{margin:0;font-family:var(--display);font-weight:400;font-size:48px;line-height:1.2}
  .lead{margin:0;font-size:18px;line-height:1.6;color:var(--muted)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .gtabs{display:flex;gap:8px;max-width:640px}
  .gtabs button{flex:1;height:auto;padding:10px 4px;border-radius:12px;white-space:nowrap;background:var(--card2);color:var(--muted);font-size:15px;font-weight:700;border:1px solid var(--line)}
  .gtabs button.on{background:var(--gold);color:#1a1530;border-color:var(--gold)}
  .ggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:640px}
  .ggrid span{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 8px;font-size:15px;font-weight:700;text-align:center}
  .grp{display:grid;grid-template-columns:120px minmax(0,1fr);align-items:center;gap:14px}
  .grp b{font-size:14px;color:var(--gold);white-space:nowrap}
  @media (max-width:480px){ .gtabs button{font-size:13px} }
  .chips span{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:14px;font-weight:700}
  .mascots{display:flex;gap:6px;align-items:flex-end}
  .mascots .av{width:64px}
  .panel{width:400px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px;display:flex;flex-direction:column;gap:20px}
  .panel h2{margin:0;font-size:14px;color:var(--muted)}
  #pin{height:56px;font-size:22px;text-align:center;letter-spacing:.1em}
  .or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
  .or i{flex:1;height:1px;background:var(--line)}
  .msg{min-height:20px;font-size:13px;color:var(--coral)}
  footer{text-align:center;font-size:13px;color:var(--muted);padding-top:16px}
  @media (max-width:900px){
    main{flex-direction:column;align-items:stretch;gap:28px}
    h1{font-size:34px} .panel{width:auto} .page{padding:20px 16px}
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="logo">탭퀴즈</div>
    <nav><a href="terms.html">이용약관</a><a href="privacy.html">개인정보 처리방침</a></nav>
  </header>
  <main>
    <section class="hero">
      <div class="eyebrow">TAP QUIZ</div>
      <h1>QR만 찍으면 바로 시작하는<br>실시간 퀴즈쇼</h1>
      <p class="lead">로그인도 설치도 없어요. 워크숍, 가족 모임, 행사에서 큰 화면과 휴대폰만 있으면 바로 같이 즐길 수 있어요.</p>
      <div class="gtabs" id="gtabs">
        <button class="on" data-g="0">🧠 퀴즈형</button><button data-g="1">⚡ 순발력형</button><button data-g="2">👀 관찰·기억형</button>
      </div>
      <div class="ggrid" id="ggrid"></div>
      <script>
      (function(){
        var G = [
          ['퀴즈','숫자 맞추기','이구동성','빠른 계산','색깔 맞추기','밸런스 게임'],
          ['반응 탭','연타 배틀','숫자 순서 터치','눈치게임'],
          ['간식 먹은 탭탭이','다른 탭탭이 찾기','기억력 패턴','카드 위치 기억']
        ];
        var tabs = document.querySelectorAll('#gtabs button'), grid = document.getElementById('ggrid');
        function show(n){ tabs.forEach(function(b,i){ b.classList.toggle('on', i===n); }); grid.innerHTML = G[n].map(function(t){ return '<span>'+t+'</span>'; }).join(''); }
        tabs.forEach(function(b){ b.onclick = function(){ show(+b.getAttribute('data-g')); }; });
        show(0);
      })();
      </script>
      <div class="mascots" id="mascots"></div>
    </section>
    <section class="panel">
      <form id="joinForm" style="display:flex;flex-direction:column;gap:10px" autocomplete="off">
        <h2><label for="pin">참가하기 (휴대폰)</label></h2>
        <input id="pin" type="text" inputmode="numeric" maxlength="6" placeholder="방 번호 6자리">
        <button type="submit" style="height:52px;font-size:17px">입장하기</button>
        <div class="msg" id="msg" role="alert"></div>
      </form>
      <div class="or"><i></i>또는<i></i></div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <h2>진행하기 (노트북·PC)</h2>
        <a href="host.html" style="text-decoration:none"><button type="button" class="ghost" style="width:100%;height:52px;font-size:17px">방 만들기</button></a>
      </div>
    </section>
  </main>
  <footer>회원가입 없음 · 개인정보 수집 없음 · 만든 방은 24시간 뒤 자동으로 삭제돼요</footer>
</div>
<script>
(function(){
  var cols = ['3,0','0,1','2,2','6,3','5,4','7,5'];
  document.getElementById('mascots').innerHTML = cols.map(function(a,i){
    return '<span class="av m-idle" style="width:64px;animation-delay:-'+(i*0.5)+'s">'+Jelly.svg(a)+'</span>';
  }).join('');
  var pin = document.getElementById('pin');
  pin.addEventListener('input', function(){ pin.value = pin.value.replace(/\D/g,'').slice(0,6); });
  document.getElementById('joinForm').addEventListener('submit', function(e){
    e.preventDefault();
    if(pin.value.length !== 6){ document.getElementById('msg').textContent = '방 번호 6자리를 입력해 주세요'; return; }
    location.href = 'player.html?pin=' + encodeURIComponent(pin.value);
  });
})();
</script>
</body>
</html>
