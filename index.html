<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>탭퀴즈 - QR만 찍으면 바로 시작하는 실시간 퀴즈쇼</title>
<meta name="description" content="로그인도 설치도 없어요. 워크숍, 가족 모임, 행사에서 큰 화면과 휴대폰만 있으면 바로 같이 즐길 수 있는 실시간 퀴즈·파티 게임.">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="jelly.js"></script>
<style>
  .page{max-width:1180px;margin:0 auto;padding:26px 36px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center}
  .logo{font-family:var(--display);font-size:34px;letter-spacing:.02em;background:var(--ink);color:var(--gold);padding:2px 16px;border-radius:12px;transform:rotate(-2deg);box-shadow:4px 4px 0 var(--coral)}
  nav{display:flex;gap:22px;font-size:14px;font-weight:700}nav a{color:var(--ink)}nav{align-items:center;flex-wrap:wrap;justify-content:flex-end}.sharebtn{height:34px;padding:0 12px;font-size:13px;background:#fff;border:2px solid var(--ink);border-radius:999px;box-shadow:none;font-weight:800;cursor:pointer;color:var(--ink)}
  main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:52px;align-items:start;padding:30px 0 20px}
  .eye{display:inline-block;font-family:var(--display);background:var(--mint);border:3px solid var(--ink);border-radius:999px;padding:3px 14px;font-size:13px;letter-spacing:.12em;box-shadow:3px 3px 0 var(--ink)}
  h1{margin:0 0 18px;font-family:var(--display);font-weight:400;font-size:64px;line-height:1.18;letter-spacing:-.015em}
  h1 mark{background:linear-gradient(transparent 55%,var(--gold) 55% 92%,transparent 92%);color:inherit;padding:0 4px}
  .lead{font-size:18px;line-height:1.75;margin:0 0 28px;max-width:540px;font-weight:500;letter-spacing:-.02em}
  .tabs{display:flex;gap:8px;margin-bottom:18px;padding-bottom:18px;border-bottom:2px dashed rgba(27,21,48,.22);flex-wrap:nowrap}
  .tab{flex:1 1 auto;white-space:nowrap;text-align:center;border:3px solid var(--ink);background:#fff;border-radius:14px;padding:10px 8px;font-weight:700;font-size:15px;height:auto;box-shadow:3px 3px 0 var(--ink)}
  .tab.on{background:var(--coral);color:#fff;transform:translate(-1px,-2px);box-shadow:5px 5px 0 var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:600px}
  .chip{border:3px solid var(--ink);background:#fff;border-radius:16px;padding:16px 8px;font-weight:700;text-align:center;font-size:17px;letter-spacing:-.02em;box-shadow:4px 4px 0 var(--ink)}
  .chip:nth-child(6n+1){background:#FFE3EC;transform:rotate(-1deg)}.chip:nth-child(6n+2){background:#D9F7F2;transform:rotate(.8deg)}.chip:nth-child(6n+3){background:#E3EBFF;transform:rotate(-.6deg)}
  .chip:nth-child(6n+4){background:#E9DDFF;transform:rotate(.7deg)}.chip:nth-child(6n+5){background:#FFEFC2;transform:rotate(-.9deg)}.chip:nth-child(6n+6){background:#FFE3EC;transform:rotate(.5deg)}
  .mas{display:flex;margin-top:28px;max-width:600px;justify-content:space-between}
  .mas .av{width:92px;display:block;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(3px 4px 0 var(--ink))}
  .mas .av svg{filter:none}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .side{display:flex;flex-direction:column;gap:20px;margin-top:6px}
  .box{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:24px;box-shadow:7px 7px 0 var(--ink)}
  .box h2{margin:0 0 10px;font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .in{height:54px;border:3px solid var(--ink);border-radius:14px;font-size:20px;text-align:center;background:#FFFBEF;letter-spacing:.08em}
  .btn{display:block;width:100%;height:56px;font-size:19px;font-weight:700;color:var(--ink);text-decoration:none;text-align:center;line-height:50px;border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink)}
  .btn.sun{background:var(--gold)} .btn.mint{background:var(--mint)}
  .or{text-align:center;font-weight:900;font-size:13px;margin:16px 0}
  .rk{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;margin-top:12px;font-weight:700;font-size:16px}
  .rk b{width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:14px;background:#fff}
  .rk:nth-of-type(1) b{background:var(--gold)}.rk:nth-of-type(2) b{background:var(--mint)}.rk:nth-of-type(3) b{background:var(--coral);color:#fff}
  .rk small{color:var(--muted);font-weight:700}
  .rk.rec b{width:14px;height:14px;margin:0 8px;border-width:2.5px;background:var(--gold)!important}
  .rk.rec:nth-of-type(2n) b{background:var(--mint)!important}.rk.rec:nth-of-type(3n) b{background:var(--coral)!important}
  .msg{min-height:18px;font-size:13px;font-weight:700;color:#D6195A;margin-top:6px}
    @media (max-width:900px){
    .page{padding:18px 16px}
    main{display:flex;flex-direction:column;gap:26px;padding:26px 0 10px}
    h1{font-size:42px}.lead{font-size:16px}
    .grid{max-width:none}.chip{font-size:15px;padding:14px 6px}
    .mas{max-width:none}.mas .av{width:auto;flex:1;max-width:80px;min-width:0}
    .tabs{flex-wrap:nowrap;gap:4px}.tab{flex:1 1 auto;white-space:nowrap;text-align:center;padding:9px 1px;font-size:12px;letter-spacing:-.3px;box-shadow:2px 2px 0 var(--ink);border-width:2.5px}
    .logo{font-size:28px}nav{gap:12px;font-size:12px}
    .side{display:contents}.top5{order:5;align-self:stretch}
    body{padding-bottom:150px}
    .cc{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:22px 22px 0 0;border-width:3px 0 0;box-shadow:0 -4px 0 var(--ink);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;background:#fff}
    .cc .or{display:none}
    .cc .jn{order:1;display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:8px}
    .cc .jn h2{grid-column:1/-1;margin:0}
    .cc .jn .in{height:50px;font-size:18px}
    .cc .jn .btn{height:50px;font-size:17px;line-height:44px}
    .cc .jn .msg{grid-column:1/-1;margin:0;min-height:0}
    .cc .mk{order:2;display:flex;align-items:center;justify-content:center;gap:8px}
    .cc .mk h2{margin:0;font-size:13px;font-weight:500}
    .cc .mk .btn{width:auto;height:34px;padding:0 14px;font-size:13px;line-height:28px;box-shadow:2px 2px 0 var(--ink);border-width:2.5px}
  }
  @media (min-width:901px) and (max-width:1120px){ .tabs{gap:5px;flex-wrap:nowrap}.tab{flex:1 1 auto;font-size:13px;padding:9px 6px;border-width:2.5px;box-shadow:2px 2px 0 var(--ink)} }
  @media (min-width:901px){
    .cc .mk{margin-bottom:0}
    .cc .jn .in{height:48px;font-size:18px}
    .cc .jn .btn{height:48px;font-size:16px;line-height:42px;box-shadow:3px 3px 0 var(--ink)}
  }
</style>
<style>html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}</style>
<script>["gesturestart","gesturechange","gestureend"].forEach(function(e){document.addEventListener(e,function(ev){ev.preventDefault()})});var _lt=0;document.addEventListener("touchend",function(ev){var t=Date.now();if(t-_lt<350)ev.preventDefault();_lt=t},{passive:false});</script>
</head>
<body>
<div class="page">
  <header><div class="logo">탭퀴즈</div><nav><button type="button" id="shareSite" class="sharebtn">📤 친구에게 알려주기</button><a href="terms.html">이용약관</a><a href="privacy.html">개인정보 처리방침</a></nav></header>
  <main>
    <section>
      <h1>QR만 찍으면<br>바로 시작하는<br><mark>실시간 퀴즈쇼</mark></h1>
      <p class="lead">로그인·설치 없이, 휴대폰만 있으면 바로 즐겨요.</p>
      <div class="tabs" id="tabs"></div>
      <div class="grid" id="grid"></div>
      <div class="mas" id="mas"></div>
    </section>
    <aside class="side">
      <div class="box cc">
        <div class="mk"><a class="btn mint" href="host.html">방 만들기</a></div>
        <div class="or">— 또는 —</div>
        <form class="jn" id="joinForm" autocomplete="off">
          <input class="in" id="pin" aria-label="방 번호 6자리" type="text" inputmode="numeric" maxlength="6" placeholder="방 번호 6자리">
          <button type="submit" class="btn sun">입장하기</button><div class="msg" id="msg" role="alert"></div></form>
      </div>
      <div class="box top5" style="padding:20px 22px"><h2 style="font-size:16px;margin:0"><span id="t5title">✨ 탭퀴즈 추천 게임</span></h2><div id="t5"></div></div>
    </aside>
  </main>
</div>
<script>
(function(){
  var G = [
    ['🧠 퀴즈', ['퀴즈','숫자 맞추기','이구동성','빠른 계산','색깔 맞추기','밸런스 게임']],
    ['⚡ 순발력', ['반응 탭','연타 배틀','순서 터치','눈치게임']],
    ['👀 관찰', ['간식 먹은 탭탭이','다른 탭탭이 찾기','기억력 패턴','카드 위치 기억']],
    ['🎮 액션', ['리듬 탭','50m 달리기','탭탭이 뽑기','풍선 다트','단체 줄넘기','풍선 불기','팀 줄다리기']],
    ['🎉 분위기', ['행운권 추첨','돌림판','사다리 타기','순서 정하기','라이어 게임','도형 그리기','가위바위보','폭탄 돌리기']]
  ];
  var NAME = { rhythm:'리듬 탭', run:'50m 달리기', claw:'탭탭이 뽑기', dart:'풍선 다트', rope:'단체 줄넘기', pump:'풍선 불기', tug:'팀 줄다리기', quiz:'퀴즈', reaction:'반응 탭', number:'숫자 맞추기', mash:'연타 배틀', match:'이구동성', shuffle:'간식 먹은 탭탭이', diff:'다른 탭탭이 찾기', memory:'기억력 패턴', tapnum:'순서 터치', cardpos:'카드 위치 기억', nunchi:'눈치게임', calc:'빠른 계산', stroop:'색깔 맞추기', balance:'밸런스 게임', raffle:'행운권 추첨', wheel:'돌림판', ladder:'사다리 타기', order:'순서 정하기', liar:'라이어 게임', draw:'도형 그리기', rps:'가위바위보 서바이벌', bomb:'폭탄 돌리기' };
  var tabsEl = document.getElementById('tabs'), grid = document.getElementById('grid');
  tabsEl.innerHTML = G.map(function(g,i){ return '<button class="tab'+(i===0?' on':'')+'" data-g="'+i+'">'+g[0]+'</button>'; }).join('');
  function show(n){ tabsEl.querySelectorAll('.tab').forEach(function(b,i){ b.classList.toggle('on', i===n); }); grid.innerHTML = G[n][1].map(function(t){ return '<div class="chip">'+t+'</div>'; }).join(''); }
  tabsEl.querySelectorAll('.tab').forEach(function(b){ b.onclick = function(){ show(+b.getAttribute('data-g')); }; });
  show(0);

  var cols = ['3,0','2,2','6,3','5,4','7,5','0,1'];
  document.getElementById('mas').innerHTML = cols.map(function(a,i){ return '<span class="av" style="animation-delay:-'+(i*.45)+'s">'+Jelly.svg(a)+'</span>'; }).join('');

  /* 인기 TOP 5: 데이터가 충분하면 실제 순위, 아니면 추천 게임 */
  var REC = ['quiz','run','liar','rope','bomb'];
  function paint(list, real){
    document.getElementById('t5title').textContent = real ? '🔥 이번 주 인기 게임 TOP5' : '✨ 탭퀴즈 추천 게임';
    document.getElementById('t5').innerHTML = list.map(function(r,i){ return '<div class="rk'+(real?'':' rec')+'"><b>'+(real?(i+1):'')+'</b><span>'+(NAME[r.game_id]||r.game_id)+'</span><small>'+(real? r.plays+'번' : '')+'</small></div>'; }).join('');
  }
  paint(REC.map(function(g){ return { game_id:g }; }), false);
  try{
    var C = window.TQ_CONFIG || {};
    if(C.SUPABASE_URL && window.supabase){
      var sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
      sb.rpc('top_games', { days:7, lim:5 }).then(function(r){
        var d = (r && r.data) || [], total = d.reduce(function(a,x){ return a+Number(x.plays); }, 0);
        if(d.length >= 3 && total >= 10) paint(d.map(function(x){ return { game_id:x.game_id, plays:Number(x.plays) }; }), true);
      }).catch(function(){});
    }
  }catch(e){}

  var shareBtn = document.getElementById('shareSite');
  if(shareBtn) shareBtn.onclick = function(){ var url = location.origin + location.pathname.replace(/index\.html$/,''), text = 'QR만 찍으면 바로 시작하는 실시간 퀴즈쇼, 탭퀴즈';
    if(navigator.share){ navigator.share({ title:'탭퀴즈', text:text, url:url }).catch(function(){}); }
    else if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(function(){ shareBtn.textContent = '✅ 링크를 복사했어요'; setTimeout(function(){ shareBtn.textContent = '📤 친구에게 알려주기'; }, 2000); }, function(){}); } };
  var pin = document.getElementById('pin');
  pin.addEventListener('input', function(){ pin.value = pin.value.replace(/\D/g,'').slice(0,6); });
  document.getElementById('joinForm').addEventListener('submit', function(e){
    e.preventDefault();
    if(pin.value.length !== 6){ document.getElementById('msg').textContent = '방 번호 6자리를 입력해 주세요'; return; }
    location.href = 'player.html?pin=' + encodeURIComponent(pin.value);
  });
})();
</script>
</body>
</html>
