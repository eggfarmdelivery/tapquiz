<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>탭퀴즈 - 참가하기</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="jelly.js"></script>
<script src="shareimg.js"></script>
<script src="shuffle.js"></script>
<script src="minigames.js"></script>
<script src="party.js"></script>
<script src="party_player.js"></script>
<style>
  body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  #app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:20px 18px 28px;display:flex;flex-direction:column;gap:16px}
  .center{flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
  .logo{font-family:var(--display);font-size:24px;color:var(--gold);background:var(--ink);padding:1px 12px;border-radius:10px;transform:rotate(-2deg);box-shadow:3px 3px 0 var(--coral)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .mebar{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
  .mebar .av{width:34px}
  .mebar{color:var(--ink);font-weight:700}
  .qbox{background:var(--card);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:18px;padding:18px;font-family:var(--display);font-size:22px;line-height:1.45;text-align:center;word-break:keep-all}
  .ans{display:flex;flex-direction:column;gap:10px}
  .abtn{height:auto;min-height:64px;padding:12px 16px;font-size:18px;text-align:left;display:flex;align-items:center;gap:12px;color:#1B1530;border-radius:16px;font-weight:700;box-shadow:0 5px 0 var(--ink)}
  .abtn img{width:70px;height:52px;object-fit:cover;border-radius:8px;flex:none}
  .abtn .k{width:30px;height:30px;border-radius:9px;background:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex:none}
  .tline{display:flex;align-items:center;gap:10px}
  .tn{font-family:var(--display);font-size:30px;line-height:1;min-width:34px;text-align:right;color:var(--ink)}
  .tn.red{color:#E5195A;animation:tq-pulse .5s ease-in-out infinite alternate}
  .bar i.red{background:#E5195A!important}
  @keyframes tq-pulse{to{transform:scale(1.18)}}
  .bar{height:12px;border-radius:6px;background:#fff;border:2px solid var(--ink);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--mint);transition:width .25s linear}
  .big{font-family:var(--display);font-size:34px;line-height:1.25}
  .pts{font-family:var(--display);font-size:56px;line-height:1}
  .picker{display:flex;flex-direction:column;align-items:center;gap:10px}
  .picker .av{width:112px}
  .pk{width:100%;display:flex;flex-direction:column;gap:8px;text-align:left}
  .pk .lab{font-size:12px;font-weight:700;color:var(--muted)}
  .pk-colors{display:flex;justify-content:space-between;gap:4px}
  .pk-colors .sw{flex:1;max-width:38px;aspect-ratio:1;height:auto;min-height:0;padding:0;border-radius:50%;border:2px solid var(--ink);box-shadow:none}
  .pk-colors .sw.on{outline:3px solid var(--coral);outline-offset:2px}
  .pk-acc{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
  .pk-acc .ac{height:auto;min-height:0;padding:3px;border-radius:12px;border:2px solid var(--ink);box-shadow:none;background:#fff}
  .pk-acc .ac.on{background:var(--gold)}
  .pk-acc .ac .av{width:100%}
  .toast{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);background:var(--gold);color:var(--ink);padding:10px 20px;border-radius:999px;font-weight:800;font-size:15px;z-index:20;box-shadow:3px 3px 0 var(--ink);border:3px solid var(--ink)}
  /* 반응 탭 */
  .rx{flex-grow:1;display:flex;flex-direction:column;gap:12px}
  .rx-top{text-align:center;font-weight:700;font-size:17px}
  .rx-zone{flex-grow:1;min-height:320px;border-radius:24px;display:flex;align-items:center;justify-content:center;background:#fff;color:#1a1530;font-family:var(--display);user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer}
  .rx-zone.dark{background:var(--card);color:var(--text);cursor:default}
  .rx-zone{border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
  .rx-zone svg{width:56%;height:56%;max-width:260px;max-height:260px}
  .rx-big{font-size:110px;line-height:1}
  .rx-q{font-size:96px;color:#B9B2D0}
  .rowrank{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 12px}
  .rowrank:nth-child(1){background:#FFEFC2}.rowrank:nth-child(2){background:#D9F7F2}.rowrank:nth-child(3){background:#FFE3EC}
  .rowrank .no{font-family:var(--display);color:var(--muted);width:22px}
  .rowrank .av{width:36px}
  .rowrank .nm{flex-grow:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
  .rowrank.me{outline:3px solid var(--coral);outline-offset:2px}
</style>
<style>html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}</style>
<script>["gesturestart","gesturechange","gestureend"].forEach(function(e){document.addEventListener(e,function(ev){ev.preventDefault()})});var _lt=0;document.addEventListener("touchend",function(ev){var t=Date.now();if(t-_lt<350)ev.preventDefault();_lt=t},{passive:false});</script>
</head>
<body>
<div id="app"></div>
<script>
var $ = function(id){ return document.getElementById(id); };
var esc = Jelly.esc;
var CFG = window.TQ_CONFIG || {};
var app = $('app');
var sb = null;
if(CFG.SUPABASE_URL && CFG.SUPABASE_URL.indexOf('YOUR_')!==0) sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);

var KEYCOL = ['#FF5D8F','#FFC24B','#2DD4BF','#7AA2FF'];
var COLOR_KO = {red:'빨간',blue:'파란',black:'검은',green:'초록'};
var SHAPE_KO = {circle:'동그라미',square:'네모',triangle:'세모',star:'별',diamond:'마름모',clover:'클로버'};
var COLOR_HEX = {red:'#E53935',blue:'#1E5BFF',black:'#111111',green:'#1B9E4B'};
function shapeSVG(shape, color){
  var c = COLOR_HEX[color] || color;
  var p = {
    circle:'<circle cx="50" cy="50" r="38" fill="'+c+'"/>',
    square:'<rect x="14" y="14" width="72" height="72" rx="4" fill="'+c+'"/>',
    triangle:'<polygon points="50,8 92,88 8,88" fill="'+c+'"/>',
    star:'<polygon points="50,5 61,35 95,35 68,55 78,90 50,70 22,90 32,55 5,35 39,35" fill="'+c+'"/>',
    diamond:'<polygon points="50,6 94,50 50,94 6,50" fill="'+c+'"/>',
    clover:'<circle cx="34" cy="42" r="20" fill="'+c+'"/><circle cx="66" cy="42" r="20" fill="'+c+'"/><circle cx="50" cy="66" r="20" fill="'+c+'"/><rect x="45" y="76" width="10" height="20" fill="'+c+'"/>'
  };
  return '<svg viewBox="0 0 100 100" role="img" aria-label="'+(COLOR_KO[color]||'')+' '+(SHAPE_KO[shape]||'')+'">'+(p[shape]||p.circle)+'</svg>';
}
function safeUrl(u){ return /^https?:\/\//i.test(u||'') ? u : ''; }
function norm(s){ return String(s==null?'':s).replace(/\s+/g,'').toLowerCase(); }
function fmtQ(s){ return esc(s).replace(/\{\{ink:(#[0-9a-fA-F]{6})\}\}([^{]*)/g, function(m,c,t){ return '<span style="color:'+c+'">'+t+'</span>'; }); }
function pts(rt){ return Math.max(100 - Math.floor((rt||0)/100), 20); }
function avHTML(av, team, w){ return '<span class="av" style="width:'+w+'px">'+Jelly.svg(av, team)+'</span>'; }
function toast(msg){ var t = document.createElement('div'); t.className='toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2200); }

var MAX_PLAYERS = 30;
var qs = new URLSearchParams(location.search);
var S = { room:null, me:null, questions:[], answerRow:null, shownAt:0, sig:'', rxTimer:null, rxDone:false };

function saveSession(){ try{ localStorage.setItem('tq_player_v1', JSON.stringify({ roomId:S.room.id, participantId:S.me.id, pin:S.room.pin })); }catch(e){} }
function loadSession(){ try{ return JSON.parse(localStorage.getItem('tq_player_v1')||'null'); }catch(e){ return null; } }
function clearSession(){ try{ localStorage.removeItem('tq_player_v1'); }catch(e){} }

/* ============ 시작 ============ */
(function fontBtn(){
  var steps = [1, 1.15, 1.3], i = 0;
  try{ i = Math.max(0, Math.min(2, +(localStorage.getItem('tq_fz')||0))); }catch(e){}
  var apply = function(){ var a = document.getElementById('app'); if(a) a.style.zoom = steps[i]; };
  var b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label','글씨 크기'); b.textContent = '가'; b.className = 'ghost';
  b.style.cssText = 'position:fixed;right:10px;bottom:10px;width:44px;height:44px;border-radius:50%;padding:0;font-size:'+(15+i*2)+'px;z-index:80;box-shadow:0 3px 0 var(--ink);opacity:.9';
  b.onclick = function(){ i = (i+1)%3; try{ localStorage.setItem('tq_fz', i); }catch(e){} b.style.fontSize = (15+i*2)+'px'; apply(); };
  document.body.appendChild(b); apply();
})();
(async function init(){
  if(!sb){ app.innerHTML = '<div class="center"><div class="big">설정이 필요해요</div><div class="muted">방장에게 알려주세요 (config.js)</div></div>'; return; }
  var ses = loadSession();
  var pin = (qs.get('pin')||'').replace(/\D/g,'');
  if(ses && (!pin || ses.pin === pin)){
    var r = await sb.from('rooms').select('*').eq('id', ses.roomId).maybeSingle();
    var m = await sb.from('participants').select('*').eq('id', ses.participantId).maybeSingle();
    if(r.data && m.data && r.data.status !== 'ended'){ S.room = r.data; S.me = m.data; start(); return; }
    clearSession();
  }
  renderJoin(pin);
})();

/* ============ P1 입장 ============ */
function renderJoin(pin, errMsg){
  var avatar = Jelly.random();
  app.innerHTML = '<div class="row"><div class="logo">탭퀴즈</div></div>'
    +'<form id="jf" class="center" style="justify-content:flex-start;padding-top:8px" autocomplete="off">'
    +'<div class="picker"><div id="avBox">'+avHTML(avatar,null,96)+'</div></div>'
    +'<div class="pk"><div class="lab">색깔</div><div class="pk-colors" id="pkC"></div><div class="lab">소품</div><div class="pk-acc" id="pkA"></div>'
    +'<button type="button" class="ghost" id="avShuffle" style="height:38px;font-size:14px;align-self:center">🎲 랜덤으로 정하기</button></div>'
    +'<div style="width:100%;text-align:left"><label for="pin">방 번호</label><input id="pin" inputmode="numeric" maxlength="6" value="'+esc(pin||'')+'" placeholder="6자리" style="text-align:center;font-size:20px;letter-spacing:.1em"></div>'
    +'<div style="width:100%;text-align:left"><label for="nick">내 이름</label><input id="nick" maxlength="10" placeholder="최대 10글자" style="font-size:18px"></div>'
    +'<div class="msg" id="msg" role="alert" style="color:var(--coral);min-height:20px;font-size:14px">'+esc(errMsg||'')+'</div>'
    +'<button type="submit" style="width:100%;height:56px;font-size:19px">입장하기</button>'
    +'<div class="muted" style="font-size:12px">실명 대신 별명을 써 주세요</div>'
    +'<div class="muted" style="font-size:11px"><a href="terms.html" target="_blank" style="color:inherit">이용약관</a> · <a href="privacy.html" target="_blank" style="color:inherit">개인정보 처리방침</a></div></form>';
  var pEl = $('pin'); pEl.oninput = function(){ pEl.value = pEl.value.replace(/\D/g,'').slice(0,6); };
  var picked = false;
  function paintPicker(){
    var v = Jelly.parse(avatar); $('avBox').innerHTML = avHTML(avatar,null,96);
    $('pkC').innerHTML = Jelly.COLORS.map(function(c,i){ return '<button type="button" class="sw'+(i===v.c?' on':'')+'" data-c="'+i+'" style="background:'+c+'" aria-label="'+Jelly.COLOR_NAMES[i]+'"></button>'; }).join('');
    $('pkA').innerHTML = Jelly.ACC_NAMES.map(function(n,i){ return '<button type="button" class="ac'+(i===v.a?' on':'')+'" data-a="'+i+'" aria-label="'+n+'">'+avHTML(v.c+','+i,null,40)+'</button>'; }).join('');
    $('pkC').querySelectorAll('.sw').forEach(function(b){ b.onclick = function(){ picked = true; avatar = b.dataset.c+','+Jelly.parse(avatar).a; paintPicker(); }; });
    $('pkA').querySelectorAll('.ac').forEach(function(b){ b.onclick = function(){ picked = true; avatar = Jelly.parse(avatar).c+','+b.dataset.a; paintPicker(); }; });
  }
  paintPicker();
  $('avShuffle').onclick = function(){ picked = true; avatar = Jelly.random(); paintPicker(); };
  $('nick').oninput = function(){ if(!picked && $('nick').value.trim()){ avatar = Jelly.fromNick($('nick').value); paintPicker(); } };
  $('jf').onsubmit = async function(e){
    e.preventDefault();
    var p = pEl.value, nick = $('nick').value.trim();
    var msg = function(t){ $('msg').textContent = t; };
    if(p.length!==6) return msg('방 번호 6자리를 입력해 주세요');
    if(!nick) return msg('이름을 입력해 주세요');
    var btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
    var r = await sb.from('rooms').select('*').eq('pin', p).maybeSingle();
    if(!r.data){ btn.disabled=false; return msg('그런 방이 없어요. 번호를 다시 확인해 주세요'); }
    if(r.data.status !== 'waiting'){ btn.disabled=false; return msg('이미 시작했거나 끝난 방이에요'); }
    if(r.data.locked){ btn.disabled=false; return msg('방장이 입장을 막아 두었어요'); }
    var all = await sb.from('participants').select('nickname,join_order').eq('room_id', r.data.id);
    var list = all.data || [];
    if(list.length >= MAX_PLAYERS){ btn.disabled=false; return msg('방이 가득 찼어요 (최대 '+MAX_PLAYERS+'명)'); }
    var order = list.reduce(function(m,x){ return Math.max(m, x.join_order||0); }, 0) + 1;
    var taken = {}; list.forEach(function(x){ taken[String(x.nickname).toLowerCase()] = 1; });
    var base = nick, k = 2; while(taken[nick.toLowerCase()]){ nick = base + k; k++; }
    var renamed = nick !== base;
    var token = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Math.random()).slice(2);
    var team = (r.data.team_mode && r.data.team_assign_type==='first_come') ? (order%2===1?'A':'B') : null;
    var ins = await sb.from('participants').insert({ room_id:r.data.id, nickname:nick, join_order:order, session_token:token, avatar:avatar, team:team }).select().single();
    if(ins.error){ btn.disabled=false; return msg(/limit|가득/i.test(String(ins.error.message||'')) ? '방이 가득 찼어요 (최대 '+MAX_PLAYERS+'명)' : '입장하지 못했어요. 다시 시도해 주세요'); }
    S.room = r.data; S.me = ins.data; saveSession(); start();
    if(renamed) toast('같은 이름이 있어서 "'+nick+'"(으)로 입장했어요');
  };
}

/* ============ 진행 루프 ============ */
function start(){
  sb.channel('player-'+S.room.id)
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'rooms', filter:'id=eq.'+S.room.id}, function(p){ S.room = p.new; route(); })
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'participants', filter:'id=eq.'+S.me.id}, function(p){ S.me = p.new; })
    .subscribe();
  setInterval(poll, 1000);
  route();
}
var pollN = 0;
async function poll(){
  var r = await sb.from('rooms').select('*').eq('id', S.room.id).maybeSingle();
  if(r.data){ S.room = r.data; route(); }
  if(++pollN % 3 === 0 && S.me && !S.kicked){
    var m = await sb.from('participants').select('id').eq('id', S.me.id).maybeSingle();
    if(!m.error && !m.data) kicked();
  }
}
function kicked(){
  S.kicked = true; clearInterval(S.rxTimer); clearSession();
  var ov = document.getElementById('pauseOvP'); if(ov) ov.remove();
  app.innerHTML = '<div class="center"><div class="big">방에서 나왔어요</div><div class="muted" style="text-align:center;line-height:1.6">방장이 방에서 내보냈거나<br>방이 닫혔어요</div><button id="kBack" style="height:54px;font-size:18px;width:100%">처음으로</button></div>';
  document.getElementById('kBack').onclick = function(){ location.href = 'index.html'; };
}
function pauseUI(){
  var r = S.room, on = !!r.paused && r.status==='playing';
  if(on === !!S.paused) return;
  S.paused = on;
  var ov = document.getElementById('pauseOvP');
  if(on){ S.pausedAt = Date.now();
    if(!ov){ ov = document.createElement('div'); ov.id = 'pauseOvP'; ov.style.cssText = 'position:fixed;inset:0;background:rgba(27,21,48,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:90;color:#fff;text-align:center;font-family:var(--display)'; ov.innerHTML = '<div style="font-size:80px">⏸</div><div style="font-size:34px">방장이 잠시 멈췄어요</div><div style="font-size:15px;font-family:var(--font)">곧 이어서 시작해요</div>'; document.body.appendChild(ov); } }
  else { if(S.pausedAt) S.shownAt += Date.now()-S.pausedAt; if(ov) ov.remove(); }
}
async function route(){
  var r = S.room;
  pauseUI();
  var sg = r.status+'|'+r.current_question_index+'|'+r.reveal+'|'+(r.target_shown_at||'')+'|'+(r.status==='playing'&&S.sigPhase||'')+'|'+((r.reaction_sequence&&r.reaction_sequence.v)||'');
  if(sg === S.sig) return;
  S.sig = sg;
  clearInterval(S.rxTimer);
  if(r.status==='waiting') return renderWait();
  if(r.status==='ended') return renderFinal();
  // playing
  if(!S.questions.length){
    var q = await sb.from('questions').select('*').eq('room_id', r.id).order('order_no');
    S.questions = q.data || [];
  }
  var cur = S.questions[r.current_question_index];
  if(!cur){ S.sig=''; return; }
  var me = await sb.from('participants').select('*').eq('id', S.me.id).maybeSingle();
  if(me.data) S.me = me.data;
  var a = await sb.from('answers').select('*').eq('question_id', cur.id).eq('participant_id', S.me.id).maybeSingle();
  S.answerRow = a.data || null;
  S.base = S.base || {};
  if(!r.reveal && S.base[r.current_question_index]===undefined) S.base[r.current_question_index] = S.me.score;
  if(r.reveal) return renderResult(cur);
  if(PARTY.indexOf(cur.qtype)>=0) return renderParty(cur);
  if(cur.qtype==='reaction') return renderReaction(cur);
  if(cur.qtype==='mash') return renderMash(cur);
  if(cur.qtype==='shuffle') return renderShuffle(cur);
  if(cur.qtype==='diff') return renderDiff(cur);
  if(['memory','tapnum','cardpos','nunchi'].indexOf(cur.qtype)>=0) return renderMini(cur);
  if(S.answerRow) return renderSent(cur);
  renderAnswer(cur);
}

var PARTY = ['raffle','wheel','ladder','order','liar','draw','rps','bomb'];
async function renderParty(cur){
  var pl = await sb.from('participants').select('*').eq('room_id', S.room.id);
  S.players = (pl.data||[]).sort(function(a,b){ return a.join_order-b.join_order; });
  var ctx = { app:app, S:S, cur:cur, header:header, avHTML:avHTML,
    players:function(){ return S.players; },
    send:function(obj){ return Promise.resolve(sb.from('answers').upsert({ question_id:cur.id, participant_id:S.me.id, answer_value:JSON.stringify(obj), response_time_ms:0 }, { onConflict:'question_id,participant_id' })); } };
  TQParty.phone[cur.qtype](ctx, S.room.reaction_sequence);
}

/* ============ P2 대기 ============ */
function renderWait(){
  app.innerHTML = '<div class="row"><div class="logo">탭퀴즈</div></div>'
    +'<div class="center"><div class="m-sway">'+avHTML(S.me.avatar, S.me.team, 140)+'</div>'
    +'<div class="big">'+esc(S.me.nickname)+'</div>'
    +'<div class="muted">입장했어요! 방장이 시작하면 바로 문제가 나와요</div>'
    +'<div class="muted" style="font-size:13px">방 번호 '+esc(S.room.pin)+'</div></div>';
}

/* ============ P3 문제 ============ */
function header(cur){
  var n = S.room.current_question_index+1, t = S.questions.length;
  return '<div class="row"><div class="mebar">'+avHTML(S.me.avatar,S.me.team,34)+'<span>'+esc(S.me.nickname)+'</span></div><div class="muted" style="font-size:14px">문제 '+n+' / '+t+'</div></div>';
}
function renderAnswer(cur){
  var hostStart = S.room.target_shown_at ? new Date(S.room.target_shown_at).getTime() : 0, lag = hostStart ? Date.now()-hostStart : 0;
  S.shownAt = (hostStart && lag>=-1500 && lag<8000) ? hostStart : Date.now();
  var last = S.room.current_question_index >= S.questions.length-1;

  var tick = function(){
    var now = Date.now(), key, html, cls = 'rx-zone', ht = '';
    if(now < readyUntil){
      var sec = Math.ceil((readyUntil-now)/1000); key = 'c'+sec; html = '<span class="rx-big">'+sec+'</span>'; cls += ' dark'; ht = '준비하세요! 아직 누르지 마세요';
    } else if(now < startAt){
      key = 'q'; html = '<span class="rx-q">?</span>'; ht = '도형이 지나가요. 정해진 도형이 나오면 바로 탭!';
    } else {
      var f = Math.min(Math.floor((now-startAt)/fd), n-1);
      if(now > startAt + n*fd + 6000){ clearInterval(S.rxTimer); done = true; app.innerHTML = header(cur)+'<div class="center"><div class="big">놓쳤어요</div><div class="muted">다음 문제를 기다려 주세요</div></div>'; return; }
      key = 'f'+f; html = shapeSVG(frames[f].shape, frames[f].color); ht = '';
      if(f === n-1 && !targetLocal) targetLocal = performance.now();
    }
    if(key !== lastKey){ lastKey = key; zone.className = cls; zone.innerHTML = html; hint.textContent = ht; }
  };
  zone.addEventListener('pointerdown', function(e){
    e.preventDefault();
    var now = Date.now();
    if(done || now < readyUntil) return;               // 카운트다운 중에는 무시
    if(now < startAt) return send('early', 0);       // 시작 전에 누름
    var f = Math.min(Math.floor((now-startAt)/fd), n-1);
    if(f < n-1 || !targetLocal) return send('wrong', 0);
    send('tap', Math.round(performance.now()-targetLocal));
  });
  tick(); S.rxTimer = setInterval(tick, 30);
}
function shapeSVGBox(shape,color){ return '<div style="width:120px;height:120px">'+shapeSVG(shape,color)+'</div>'; }
function renderSentReaction(cur){
  var v = S.answerRow && S.answerRow.answer_value;
  var msg = v==='tap' ? ['잘 눌렀어요!','결과를 기다리는 중이에요'] : v==='early' ? ['너무 일찍 눌렀어요','이번 문제는 0점이에요'] : ['다른 도형이었어요','이번 문제는 0점이에요'];
  app.innerHTML = header(cur)+'<div class="center"><div class="m-bounce">'+avHTML(S.me.avatar,S.me.team,120)+'</div><div class="big">'+msg[0]+'</div><div class="muted">'+msg[1]+'</div></div>';
}

/* ============ P5 결과 ============ */
async function renderResult(cur){
  var all = await sb.from('participants').select('*').eq('room_id', S.room.id);
  var list = (all.data||[]).sort(function(a,b){ return b.score-a.score || a.join_order-b.join_order; });
  var rank = list.findIndex(function(p){ return p.id===S.me.id; })+1;
  var me = list.filter(function(p){ return p.id===S.me.id; })[0]; if(me) S.me = me;
  var a = S.answerRow, vote = cur.qtype==='vote';
  var ok = a && a.is_correct === true;
  var gain = ok ? pts(a.response_time_ms) : 0;
  var title, sub, extra = '';
  var isParty = PARTY.indexOf(cur.qtype)>=0;
  var special = ['number','mash','match','nunchi'].indexOf(cur.qtype) >= 0;
  var baseG = S.base && S.base[S.room.current_question_index];
  var partial = cur.qtype==='memory' && a && /^part:/.test(a.answer_value||'');
  if(isParty){ var bg = S.base && S.base[S.room.current_question_index]; gain = bg!=null ? Math.max(0, S.me.score-bg) : 0; ok = gain>0; title = ok ? '점수를 얻었어요!' : '게임 끝!'; sub = ok ? '+'+gain+'점' : '이번 게임은 점수가 없어요'; }
  else if(partial){ var pp = a.answer_value.slice(5).split('/'); gain = baseG!=null ? Math.max(0, S.me.score-baseG) : 0; ok = false; title = pp[0]+'개까지 맞혔어요!'; sub = '+'+gain+'점 ('+pp[1]+'개 중 '+pp[0]+'개)'; }
  else if(special){
    var base = S.base && S.base[S.room.current_question_index];
    gain = base!=null ? Math.max(0, S.me.score - base) : 0;
    ok = gain > 0;
    if(!a){ title = '제출하지 못했어요'; sub = '시간이 끝났어요 · 0점'; }
    else if(cur.qtype==='number'){ title = ok ? '가까웠어요!' : '아쉬워요'; sub = ok ? '+'+gain+'점' : '이번 문제는 0점'; extra = '정답 '+Number(cur.correct_answers[0]).toLocaleString('ko-KR')+(cur.options&&cur.options.unit?' '+cur.options.unit:'')+' · 내 답 '+a.answer_value; }
    else if(cur.qtype==='nunchi'){ title = ok ? '혼자 골랐어요!' : '겹쳤어요 ㅠㅠ'; sub = ok ? '+'+gain+'점' : '이번 문제는 0점'; extra = '내 숫자: '+a.answer_value; }
    else if(cur.qtype==='mash'){ var mm = cur.options.mode||'count'; title = ok ? (mm==='time'?'감이 좋아요!':mm==='exact'?'거의 다 맞았어요!':'연타 완료!') : '아쉬워요'; sub = ok ? '+'+gain+'점' : '이번 문제는 0점';
      if(mm==='time'){ var ms = +a.answer_value; extra = (ms/1000).toFixed(2)+'초에 눌렀어요 · '+(Math.abs(ms-10000)/1000).toFixed(2)+'초 차이'; }
      else if(mm==='exact') extra = '목표 '+cur.options.target+'번 · 내가 누른 횟수 '+a.answer_value+'번';
      else extra = '내 연타 '+a.answer_value+'번'; }
    else { title = ok ? '통했어요!' : '아쉽게 안 겹쳤어요'; sub = ok ? '+'+gain+'점' : '이번 문제는 0점'; extra = '내 답: '+a.answer_value; }
  }
  else if(vote){ title = a ? '투표했어요!' : '투표하지 않았어요'; sub = '이 문제는 정답이 없어요'; }
  else if(!a){ title = '제출하지 못했어요'; sub = '시간이 끝났어요 · 0점'; }
  else if(ok){ title = (cur.qtype==='shuffle'||cur.qtype==='diff') ? '찾았어요!' : (['memory','tapnum','cardpos'].indexOf(cur.qtype)>=0 ? '성공!' : '정답!'); sub = '+'+gain+'점'; }
  else { title = (['reaction','shuffle','diff','memory','tapnum','cardpos'].indexOf(cur.qtype)>=0) ? '아쉬워요' : '틀렸어요'; sub = '이번 문제는 0점'; }
  if(baseG!=null && !special && !partial && !isParty && ok && cur.qtype!=='vote'){ gain = Math.max(0, S.me.score-baseG); sub = '+'+gain+'점'; }
  var last = S.room.current_question_index >= S.questions.length-1;
  var rseq = S.room.reaction_sequence, sceneOK = (cur.qtype==='shuffle' && rseq && rseq.moves) || (cur.qtype==='diff' && rseq && rseq.oddIdx!=null);
  app.innerHTML = header(cur)
    +'<div class="center">'+(sceneOK ? '<div id="rsScene" style="width:100%;max-width:340px;aspect-ratio:'+(cur.qtype==='diff'?'1/1':'16/8')+';border-radius:18px;overflow:hidden;background:#2A2550;border:3px solid var(--ink)"></div>' : '<div class="'+(ok?'m-jump':'')+'">'+avHTML(S.me.avatar,S.me.team,130)+'</div>')
    +'<div class="big" style="color:'+(ok?'var(--mint)':'var(--text)')+'">'+title+'</div>'
    +'<div class="pts" style="font-size:'+(ok?56:26)+'px;color:'+(ok?'var(--gold)':'var(--muted)')+'">'+esc(sub)+'</div>'
    +(extra?'<div style="font-size:15px">'+esc(extra)+'</div>':'')+'<div class="muted">지금 '+rank+'등 · 합계 '+S.me.score+'점</div></div>'
    +'<div class="muted" style="text-align:center;font-size:13px">'+(last?'곧 최종 결과가 나와요':'다음 문제를 기다리는 중')+'</div>';
  if(sceneOK){
    var st0 = S.room.target_shown_at ? new Date(S.room.target_shown_at).getTime() : Date.now();
    if(S.shCtl) S.shCtl.stop();
    S.shCtl = cur.qtype==='shuffle' ? TQShuffle.mount($('rsScene'), rseq, st0, { final:true }) : TQDiff.mount($('rsScene'), rseq, st0, { final:true });
  }
}

/* ============ P6 최종 ============ */
async function renderFinal(){
  var all = await sb.from('participants').select('*').eq('room_id', S.room.id);
  var list = (all.data||[]).sort(function(a,b){ return b.score-a.score || a.join_order-b.join_order; });
  var rank = list.findIndex(function(p){ return p.id===S.me.id; })+1;
  var top = list.slice(0,5);
  app.innerHTML = '<div class="row"><div class="logo">탭퀴즈</div></div>'
    +'<div class="center" style="gap:10px"><div class="'+(rank<=3?'m-bounce':'m-sway')+'">'+avHTML(S.me.avatar,S.me.team,130)+'</div>'
    +'<div class="big">'+rank+'등!</div><div class="muted">'+esc(S.me.nickname)+' · '+S.me.score+'점</div></div>'
    +'<div style="display:flex;flex-direction:column;gap:8px">'+top.map(function(p,i){
      return '<div class="rowrank'+(p.id===S.me.id?' me':'')+'"><span class="no">'+(i+1)+'</span>'+avHTML(p.avatar,p.team,36)+'<span class="nm">'+esc(p.nickname)+'</span><b>'+p.score+'점</b></div>'; }).join('')+'</div>'
    +'<div class="ad-slot"><!-- 광고(AdSense) 자리: 최종 결과에만 --></div>'
    +'<div class="muted" style="text-align:center;font-size:13px">방장이 다시하기를 누르면 바로 이어져요</div>'
    +'<button id="shareImg" style="height:50px;font-size:16px">🖼 내 결과 이미지 저장</button>'
    +'<button id="again" class="ghost" style="height:50px;font-size:16px">나가기</button>';
  $('shareImg').onclick = async function(){ var b = $('shareImg'), t0 = b.textContent; b.disabled = true; b.textContent = '만드는 중…';
    try{ var blob = await TQShare.make(list, { title:'최종 결과', meId:S.me.id }); await TQShare.send(blob); }catch(e){}
    b.disabled = false; b.textContent = t0; };
  S.questions = []; S.base = {}; S.answerRow = null;
  $('again').onclick = function(){ clearSession(); location.href = 'index.html'; };
}
</script>
